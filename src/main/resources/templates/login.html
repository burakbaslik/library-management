<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --success-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --error-gradient: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            --warning-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.1);
            --shadow-strong: 0 20px 60px rgba(0, 0, 0, 0.15);
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-focus: rgba(255, 255, 255, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            pointer-events: none;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 70%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
            radial-gradient(circle at 70% 30%, rgba(255, 119, 198, 0.3) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            animation: float 18s infinite ease-in-out;
        }

        .floating-shape:nth-child(1) {
            width: 70px;
            height: 70px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-shape:nth-child(2) {
            width: 90px;
            height: 90px;
            top: 60%;
            right: 15%;
            animation-delay: -4s;
        }

        .floating-shape:nth-child(3) {
            width: 50px;
            height: 50px;
            top: 80%;
            left: 80%;
            animation-delay: -8s;
        }

        .floating-shape:nth-child(4) {
            width: 110px;
            height: 110px;
            top: 40%;
            left: 5%;
            animation-delay: -12s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.7;
            }
            25% {
                transform: translateY(-25px) rotate(90deg);
                opacity: 1;
            }
            50% {
                transform: translateY(-50px) rotate(180deg);
                opacity: 0.8;
            }
            75% {
                transform: translateY(-25px) rotate(270deg);
                opacity: 1;
            }
        }

        .container {
            position: relative;
            z-index: 2;
            animation: slideInUp 0.8s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: white;
            font-weight: 700;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 2rem !important;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
        }

        h2::before {
            content: '🔐';
            position: absolute;
            left: 50%;
            top: -60px;
            transform: translateX(-50%);
            font-size: 3rem;
            -webkit-text-fill-color: initial;
            animation: bounceIcon 2.5s ease-in-out infinite;
        }

        @keyframes bounceIcon {
            0%, 100% {
                transform: translateX(-50%) translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateX(-50%) translateY(-10px) rotate(10deg);
            }
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--shadow-strong);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.6s ease;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .form-label {
            color: white;
            font-weight: 600;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-label::before {
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
        }

        .form-label[for="username"]::before {
            content: '\f406';
        }

        .form-label[for="password"]::before {
            content: '\f023';
        }

        .form-control {
            background: var(--input-bg);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 15px 20px;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            color: #2c3e50;
            font-size: 1rem;
        }

        .form-control:focus {
            background: var(--input-focus);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(44, 62, 80, 0.6);
        }

        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            color: white;
            font-weight: 700;
            padding: 15px 30px;
            border-radius: 15px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-soft);
            position: relative;
            overflow: hidden;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-primary:hover::before {
            opacity: 1;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-strong);
            color: white;
        }

        .btn-success {
            background: var(--success-gradient);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-success::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-success:hover::before {
            opacity: 1;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-soft);
            color: white;
        }

        .btn-outline-danger {
            background: transparent;
            border: 2px solid rgba(255, 107, 107, 0.6);
            color: #ff6b6b;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn-outline-danger:hover {
            background: var(--error-gradient);
            border-color: transparent;
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-soft);
        }

        .btn-outline-secondary {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn-outline-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.6);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-soft);
        }

        p {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        a {
            color: white;
            text-decoration: none;
            font-weight: 700;
            position: relative;
            transition: all 0.3s ease;
        }

        a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gradient);
            transition: width 0.3s ease;
        }

        a:hover::after {
            width: 100%;
        }

        a:hover {
            color: white;
            transform: translateY(-2px);
        }

        #testResult {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px;
            color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            min-height: 40px;
            display: flex;
            align-items: center;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            transition: all 0.3s ease;
        }

        #testResult:not(:empty) {
            animation: resultFadeIn 0.5s ease-out;
        }

        #output {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #output.text-danger {
            background: linear-gradient(135deg, rgba(255, 65, 108, 0.2) 0%, rgba(255, 75, 43, 0.2) 100%);
            color: #ff6b6b !important;
            border: 1px solid rgba(255, 107, 107, 0.3);
            animation: errorShake 0.6s ease-out;
        }

        @keyframes resultFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes errorShake {
            0%, 100% {
                transform: translateX(0);
                opacity: 0;
            }
            25% {
                transform: translateX(-5px);
                opacity: 1;
            }
            75% {
                transform: translateX(5px);
            }
        }

        .d-flex {
            gap: 0.75rem;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .loading-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Button Icons */
        .btn-success::after {
            content: '\f085';
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            margin-left: 0.5rem;
        }

        .btn-outline-danger::after {
            content: '\f2ed';
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            margin-left: 0.5rem;
        }

        .btn-outline-secondary::after {
            content: '\f015';
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            margin-left: 0.5rem;
        }

        /* Responsive improvements */
        @media (max-width: 576px) {
            .container {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            h2 {
                font-size: 2rem;
            }

            .card {
                margin: 0 10px;
            }

            .form-control {
                padding: 12px 15px;
            }

            .btn-primary {
                padding: 12px 25px;
                font-size: 1rem;
            }

            .d-flex {
                flex-direction: column;
                gap: 0.5rem;
            }

            .btn-sm {
                width: 100%;
                justify-content: center;
            }
        }

        /* Form validation styles */
        .form-control:invalid {
            border-color: rgba(255, 107, 107, 0.5);
        }

        .form-control:valid {
            border-color: rgba(56, 239, 125, 0.5);
        }

        /* Focus improvements */
        .form-control:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.5);
            outline-offset: 2px;
        }

        .btn:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.5);
            outline-offset: 2px;
        }

        /* Security indicator */
        .security-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: var(--success-gradient);
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            box-shadow: var(--shadow-soft);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        /* Test panel styling */
        .test-panel {
            margin-top: 2rem;
            animation-delay: 0.3s;
        }

        .test-panel .card {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .test-panel h6 {
            color: white;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
        }

        .test-panel h6::before {
            content: '🧪 ';
            margin-right: 0.5rem;
        }
    </style>
    <script>
        async function login(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const out = document.getElementById('output');

            if (out) { out.textContent = ''; }

            try {
                const res = await fetch('/auth/generateToken', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) {
                    const txt = await res.text();
                    throw new Error(txt || 'Giriş başarısız');
                }

                const token = await res.text();

                if (!token || !token.startsWith('ey')) {
                    throw new Error('Backend\'den geçerli bir token alınamadı.');
                }

                localStorage.setItem('jwt', token);

                window.location.href = '/dashboard';

            } catch (e) {
                if (out) {
                    out.className = 'text-danger mt-2 small';
                    out.textContent = e.message || 'Bir hata oluştu.';
                }
            }
        }


        async function testUserEndpoint() {
            const token = localStorage.getItem('jwt');
            const r = document.getElementById('testResult');
            r.textContent = '';
            if (!token) {
                r.textContent = 'Önce giriş yapınız.';
                return;
            }
            try {
                const res = await fetch('/auth/user', { headers: { 'Authorization': 'Bearer ' + token } });
                const txt = await res.text();
                r.textContent = res.ok ? txt : ('Hata: ' + txt);
            } catch (e) {
                r.textContent = 'Hata: ' + (e.message || '');
            }
        }
    </script>
    </script>
</head>
<body>
<div class="floating-shapes">
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
</div>

<div class="container py-5" style="max-width: 480px;">
    <h2 class="mb-4">Giriş Yap</h2>
    <form class="card p-3 shadow-sm" onsubmit="login(event)">
        <div class="security-badge">
            <i class="fas fa-shield-alt"></i>
        </div>
        <div class="loading-overlay">
            <div class="spinner"></div>
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">Kullanıcı Adı</label>
            <input id="username" name="username" class="form-control" required />
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Şifre</label>
            <input id="password" name="password" type="password" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Giriş</button>
    </form>

    <p class="mt-3">Hesabınız yok mu? <a href="/register">Kayıt olun</a></p>

        <h6>Test Paneli</h6>

            <button class="btn btn-outline-danger btn-sm" onclick="localStorage.removeItem('jwt');alert('Token silindi')">Tokeni sil</button>
            <a href="/" class="btn btn-outline-secondary btn-sm">Ana sayfa</a>
        </div>
        <div id="testResult" class="mt-2 small"></div>
        <div id="output" class="mt-2 small"></div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
